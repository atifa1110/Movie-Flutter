workflows:
  flutter-ci:
    name: Flutter CI
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Clean Flutter Cache
        script: flutter clean
      - name: Analyze
        script: flutter analyze
      - name: Run unit tests (core module)
        script: |                  
          cd core
          flutter pub get
          flutter test
      - name: Run unit tests (movies module)
        script: flutter test movies/test
      - name: Run unit tests (tv series module)
        script: flutter test tv_series/test
      - name: Build APK with Flutter
        script: |
            flutter build apk --debug
      - name: Create debug and test APK
        script: |
            set -ex
            cd android
            ./gradlew app:assembleAndroidTest
            ./gradlew app:assembleDebug -Ptarget="$CM_BUILD_DIR/integration_test/app_test.dart"

    artifacts:
      - build/app/outputs/flutter-apk/app-*.apk