workflows:
  flutter-ci:
    name: Flutter CI
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "submission_2"
          include: true
          source: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - token

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Clean Flutter Cache
        script: flutter clean

      - name: Analyze
        script: flutter analyze

#      - name: Run unit tests (core module)
#        script: |
#          cd core
#          flutter pub get
#          flutter test
#
#      - name: Run unit tests (movies module)
#        script: flutter test movies/test
#
#      - name: Run unit tests (tv series module)
#        script: flutter test tv_series/test
#
#      - name: Run tests with coverage - Core Module
#        script: cd core && flutter test --coverage
#
      - name: Run tests with coverage - Movies Module
        script: cd movies && flutter test --coverage
#
#      - name: Run tests with coverage - TV Series Module
#        script: cd tv_series && flutter test --coverage

      - name: Collecting code coverage and storing in a location
        script: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install lcov
        
          cd movies
            mkdir -p test-results 
            flutter test \
              --coverage \
              --machine \
              > test-results/flutter.json

            code_coverage=$(lcov --list $CM_BUILD_DIR/coverage/lcov.info | sed -n "s/.*Total:|\(.*\)%.*/\1/p")          
            echo "Code Coverage: ${code_coverage}% "
            if (( $(echo "$code_coverage < $CODE_COVERAGE_TARGET" | bc) ))
              then { echo "code coverage is less than expected" && exit 1; }
            fi 
          test_report: test-results/flutter.json

      - name: Codecov upload
        script: |
            #!/bin/bash
                curl -Os https://uploader.codecov.io/latest/macos/codecov
                chmod +x codecov
                ./codecov -t ${CODECOV_TOKEN} -f "test-results/flutter.json"

