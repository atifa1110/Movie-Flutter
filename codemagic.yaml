workflows:
  flutter-ci:
    name: Flutter CI
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "submission_2"
          include: true
          source: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - token

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Clean Flutter Cache
        script: flutter clean

      - name: Analyze
        script: flutter analyze

      - name: Run unit tests (core module)
        script: |
          cd core
          flutter pub get
          flutter test

      - name: Run unit tests (movies module)
        script: flutter test movies/test

      - name: Run unit tests (tv series module)
        script: flutter test tv_series/test

      - name: Run tests with coverage - Core Module
        script: cd core && flutter test --coverage
#
      - name: Run tests with coverage - Movies Module
        script: cd movies && flutter test --coverage

      - name: Run tests with coverage - TV Series Module
        script: cd tv_series && flutter test --coverage

      - name: Codecov upload
        script: |
            curl -Os https://uploader.codecov.io/latest/macos/codecov
            chmod +x codecov
            ./codecov -t "${CODECOV_TOKEN}"

      - name: Build APK with Flutter
        script: flutter build apk --debug

      - name: Create Debug and Test APK
        script: |
          cd android
          ./gradlew app:assembleAndroidTest
          ./gradlew app:assembleDebug -Ptarget=integration_test/app_test.dart

    artifacts:
      - build/app/outputs/flutter-apk/app-*.apk
